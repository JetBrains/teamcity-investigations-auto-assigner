import java.nio.file.Paths

plugins {
  id 'com.github.rodm.teamcity-server' version '1.5.2'
  id 'org.jetbrains.kotlin.jvm' version '1.3.41'
}

apply plugin: 'java'
apply plugin: 'com.github.rodm.teamcity-server'
apply plugin: 'idea'

def localRepo = anyParamPath('TC_LOCAL_REPO')

ext {
  teamcityVersion = anyParam('teamcityVersion') ?: '2022.02'
  versionNumber = project.hasProperty('versionNumber') ? property('versionNumber') : 'SNAPSHOT-' + new Date().format('yyyyMMddHHmmss')
  localRepo = anyParamPath('TC_LOCAL_REPO')
}

group = 'jetbrains.buildServer.investigationsAutoAssigner'

version = versionNumber

